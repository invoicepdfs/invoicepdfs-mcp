name: Publish

# Runs in the published mirror, on a v* tag. Two publishes, in order: the npm
# package, then the MCP Registry entry that points at it. The registry only
# stores metadata, so it has to come second — it validates that the package it
# names is really on npm.
#
# This job holds no credential. It publishes over OIDC, through the trusted
# publisher configured on npmjs.com for this repository and this filename — so
# renaming this file, or moving the job to another repository, breaks publishing
# until the trusted publisher is updated to match.
#
# v0.1.0 went out with an NPM_TOKEN because npm cannot configure a trusted
# publisher for a package that does not exist yet (npm/cli#8544). That token has
# been revoked and the secret deleted; nothing here should reintroduce one. npm
# is restricting tokens that bypass 2FA anyway — account changes Aug 2026,
# direct publishing Jan 2027.
#
# Both the provenance attestation and the registry's OIDC login need
# `id-token: write`, which is also why the mirror is public: provenance is not
# available to a private repository, and a private repo gives the registry and
# the client directories no source to link to.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      # npm provenance requires package.json to name a public repository, so a
      # publish from a private mirror fails inside npm with nothing pointing at
      # the cause. The mirror starts life private on purpose; this is the step
      # that says "make it public first" rather than leaving someone to work it
      # out from an attestation error.
      - name: The repository is public
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "::error::${{ github.repository }} is private, and npm provenance" \
                 "needs a public repository. Settings → General → Change" \
                 "visibility, then re-run this tag."
            exit 1
          fi

      # Deliberately no `registry-url`. It writes
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into .npmrc, which
      # with no token expands to an empty value — npm reads that as "auth is
      # configured", never runs the OIDC exchange, and fails ENEEDAUTH.
      # actions/setup-node#1551, npm/documentation#1960. The default registry is
      # registry.npmjs.org regardless, so nothing is lost.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # Node 22 bundles npm 10.9.x, and trusted publishing needs >= 11.5.1. Done
      # now rather than at the switchover, so the move off the token is a change
      # of setting on npmjs.com and nothing here.
      - name: npm new enough to publish without a token
        run: |
          npm install -g npm@latest
          npm -v

      - run: npm ci

      # The tag is the release, but package.json's version is what npm
      # publishes and server.json's is what the registry records. Asserted
      # rather than patched from the tag: patching would publish a version the
      # committed files disagree with, and the mirror is generated from the
      # monorepo, so the fix belongs in mcp/package.json upstream.
      - name: Tag, package.json and server.json agree
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p 'require("./package.json").version')"
          SRV="$(node -p 'require("./server.json").version')"
          SRV_PKG="$(node -p 'require("./server.json").packages[0].version')"
          echo "tag=$TAG package.json=$PKG server.json=$SRV server.json/packages=$SRV_PKG"
          for actual in "$PKG" "$SRV" "$SRV_PKG"; do
            if [ "$actual" != "$TAG" ]; then
              echo "::error::version mismatch — tag v$TAG, but a file says $actual." \
                   "Bump mcp/package.json and mcp/server.json in the monorepo, let the" \
                   "mirror sync, then tag."
              exit 1
            fi
          done

      # mcpName is what lets the registry verify this package is the one
      # server.json claims, so a mismatch has to stop the release, not be
      # discovered by the registry rejecting it afterwards.
      - name: package.json mcpName matches server.json name
        run: |
          test "$(node -p 'require("./package.json").mcpName')" \
             = "$(node -p 'require("./server.json").name')"

      # The registry validates server.json at the end of this job, after
      # `npm publish` has happened and cannot be taken back. v0.1.0 went to npm
      # and then failed here on a description 49 characters over the limit,
      # leaving the package published and unlisted. Validating first turns that
      # into a failed job instead of a half-finished release.
      #
      # The schema URL comes out of server.json rather than being written here,
      # so the two cannot drift. --strict=false because the schema uses
      # `example`, which is not a draft-07 keyword and makes ajv refuse the
      # schema itself.
      - name: server.json satisfies the registry schema
        run: |
          curl -sSLf -o /tmp/server.schema.json \
            "$(node -p 'require("./server.json")["$schema"]')"
          npx --yes ajv-cli@5 validate --spec=draft7 --strict=false \
            -s /tmp/server.schema.json -d server.json

      # The registry requires a remote to be publicly reachable, and will
      # happily record one that is not — leaving a listing that sends people
      # to a 404. The endpoint ships from a different repository than this
      # one, so "is it deployed yet" is a real question at release time and
      # not a rhetorical one.
      - name: Every remote in server.json answers
        run: |
          node -p 'require("./server.json").remotes?.map(r => r.url).join("\n") ?? ""' \
            | grep . | while read -r url; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url" \
              -H 'Content-Type: application/json' --max-time 20 -d '{}' || echo 000)"
            echo "$url -> $code"
            case "$code" in
              000|404|5??)
                echo "::error::$url is not serving MCP (HTTP $code). Deploy it before" \
                     "publishing a listing that points at it."
                exit 1
                ;;
              3??)
                # v0.1.2 nearly shipped a listing for a URL that answered 307
                # to its own trailing-slash form. That works only for clients
                # that follow a redirect and re-POST with their headers intact,
                # and the canonical URI in server.json has no trailing slash on
                # purpose. The advertised URL has to answer where it is.
                echo "::error::$url redirects (HTTP $code) rather than answering." \
                     "Clients are not required to follow it. Serve the advertised" \
                     "URL directly."
                exit 1
                ;;
            esac
          done

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # A release is two publishes and only the first is irreversible, so this
      # one is a no-op when the version is already up. v0.1.1 published to npm
      # and then failed registering, and without this the only way to finish it
      # was a version bump users would have had no reason for.
      #
      # --provenance is implied by trusted publishing; stated anyway, so that a
      # release without an attestation fails here rather than shipping quietly.
      - name: Publish to npm
        run: |
          NAME="$(node -p 'require("./package.json").name')"
          VER="$(node -p 'require("./package.json").version')"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER is already on npm — skipping publish, continuing to the registry."
          else
            npm publish --provenance --access public
          fi

      # npm answers "your package is being processed and may take a few minutes
      # to become available", and the MCP Registry refuses to register a version
      # it cannot fetch. v0.1.1 failed exactly here, two seconds after a
      # successful publish; the version appeared about forty seconds later.
      - name: Wait for npm to serve this version
        run: |
          URL="https://registry.npmjs.org/$(node -p 'encodeURIComponent(require("./package.json").name)')/$(node -p 'require("./package.json").version')"
          for i in $(seq 1 30); do
            if curl -fsS "$URL" >/dev/null 2>&1; then
              echo "npm is serving it after ~$((i * 10))s."
              exit 0
            fi
            sleep 10
          done
          echo "::error::npm has not served this version after five minutes." \
               "The package is published; re-run this job to finish registering it."
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # GitHub OIDC again, the same id-token this job publishes to npm with.
      # It authorises the io.github.invoicepdfs/* namespace, which is why
      # server.json is named that way rather than com.invoicepdfs/* — the
      # custom-domain form needs a DNS TXT record and an Ed25519 key in a
      # secret, and this workflow now keeps no secrets at all.
      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
